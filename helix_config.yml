providers:
  - provider: kraken
    reconnect_delay_secs: 5
    max_reconnect_attempts: 5
    symbol_feeds:
      - markets: crypto
        symbol: "BTC/USD"
        feed_type: trades
      - markets: crypto
        symbol: "ETC/USD"
        feed_type: trades

database_conf:
  postgres_config:
    host: localhost
    port: "5432"
    database: helixfeed_dev
    user: "helixfeed"
    password: "devpassword"
  duckdb_location: "/db/kraken.duckdb"
  # r2 omitted entirely — it's Option<R2Config> with #[serde(default)], so leaving it out is valid

log_config:
  feed_log_location: "logs/kraken.log"
  system_log_location: "logs/system.log"

buffer_capacity: 100
buffer_swap_trigger: 0.8
  
  
  
  
  
  
